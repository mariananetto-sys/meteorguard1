<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeteorGuard API Tester</title>
    <style>
        * { box-sizing: border-box; font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif; }
        body {
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
            background: #0f172a;
        }
        .container {
            width: min(100% - 24px, 600px);
            height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .header {
            padding: 15px;
            background: #0f172a;
            border-bottom: 1px solid #334155;
        }
        .header h3 {
            margin: 0 0 10px;
            color: #2f8f83;
        }
        .config-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .config-row input,
        .controls input {
            width: 100%;
            padding: 8px;
            color: #fff;
            background: #0f172a;
            border: 1px solid #475569;
            border-radius: 6px;
        }
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            overflow-y: auto;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.5;
            white-space: pre-line;
        }
        .msg-user {
            align-self: flex-end;
            background: #2f8f83;
            border-bottom-right-radius: 2px;
        }
        .msg-ai {
            align-self: flex-start;
            background: #334155;
            border-left: 3px solid #2f8f83;
            border-bottom-left-radius: 2px;
        }
        .msg-error {
            align-self: flex-start;
            color: #ffb3c6;
            background: #ff336622;
            border-left: 3px solid #ff3366;
            border-bottom-left-radius: 2px;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            padding: 15px;
            background: #0f172a;
            border-top: 1px solid #334155;
        }
        .controls label {
            display: block;
            margin-bottom: 4px;
            color: #94a3b8;
            font-size: 0.75rem;
        }
        .send-btn {
            grid-column: span 3;
            padding: 12px;
            color: #0f172a;
            background: #2f8f83;
            border: 0;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
        }
        .send-btn:hover { background: #45aa9d; }
        .send-btn:disabled { cursor: wait; opacity: 0.65; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h3>MeteorGuard API Client</h3>
            <div class="config-row">
                <input type="text" id="apiUrl" value="https://meteorguard.vercel.app/api/predict" placeholder="URL da API">
                <input type="password" id="apiKey" value="" placeholder="Sua API Key">
            </div>
        </div>

        <div class="chat-area" id="chat">
            <div class="message msg-ai">Interface de testes da API. Preencha sua API key manualmente, ajuste os valores meteorológicos e clique em Analisar.</div>
        </div>

        <div class="controls">
            <div>
                <label for="valTemp">Temperatura (°C)</label>
                <input type="number" id="valTemp" value="32">
            </div>
            <div>
                <label for="valRain">Chuva (mm/h)</label>
                <input type="number" id="valRain" value="45">
            </div>
            <div>
                <label for="valWind">Vento (km/h)</label>
                <input type="number" id="valWind" value="95">
            </div>
            <button class="send-btn" id="sendBtn">Analisar pela API</button>
        </div>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message msg-${type}`;
            div.textContent = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        sendBtn.addEventListener('click', async () => {
            const url = document.getElementById('apiUrl').value.trim();
            const key = document.getElementById('apiKey').value.trim();

            const payload = {
                temperature: Number(document.getElementById('valTemp').value),
                precipitation: Number(document.getElementById('valRain').value),
                windSpeed: Number(document.getElementById('valWind').value),
                humidity: 80,
                pressureMsl: 990
            };

            addMessage(`Verificando: ${payload.temperature}°C, chuva ${payload.precipitation}mm, vento ${payload.windSpeed}km/h`, 'user');

            sendBtn.disabled = true;
            sendBtn.textContent = 'Enviando...';

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-api-key': key
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error || 'Erro crítico na chamada');

                addMessage(String(data.prediction?.analysis || 'Resposta sem análise.'), 'ai');
            } catch (err) {
                addMessage(`ERRO DE API: ${err.message}`, 'error');
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = 'Analisar pela API';
            }
        });
    </script>
</body>
</html>
